<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResumeScreen AI</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><a class="brand" href="/">ResumeScreen <b>AI</b></a><span>AI-Powered Resume Screening &amp; Candidate Ranking</span></header>
<main><section class="hero"><p class="eyebrow">Recruitment intelligence</p><h1>Screen candidates with evidence, not guesswork.</h1><p>Upload a job description and up to 50 resumes. Scores use transparent semantic, skills, experience, education, and preferred-skill signals.</p></section>
<section class="panel"><form id="screening-form"><label>Job description<textarea id="jd" name="job_description" placeholder="Paste the job description here…" required></textarea></label><label class="file-row">Or upload JD <input id="jd-file" type="file" accept=".pdf,.docx,.txt"><span id="jd-name"></span></label><label class="drop" id="drop-zone">Drop resumes here or <span>browse</span><input id="resumes" type="file" multiple accept=".pdf,.docx,.txt"><small>PDF, DOCX, TXT · max 5 MB each</small></label><div id="file-list"></div><div class="form-footer"><span id="count">0 resumes selected</span><button id="analyze" type="submit">Analyze Candidates</button></div><p class="status" id="status" role="status"></p></form></section></main><script src="js/app.js"></script></body></html>
